services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: vendor
      POSTGRES_PASSWORD: vendorpass
      POSTGRES_DB: vendor_risk_db
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendor -d vendor_risk_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: vendorpass
    volumes:
      - ./src/lib/schema.sql:/schema.sql:ro
    command: ["psql", "-h", "db", "-U", "vendor", "-d", "vendor_risk_db", "-f", "/schema.sql"]
    restart: "no"

  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://vendor:vendorpass@db:5432/vendor_risk_db
      - DB_POOL_MIN=2
      - DB_POOL_MAX=10
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh -c "npm install && npx next dev -p 3000 -H 0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  db-data:
